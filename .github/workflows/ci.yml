name: CI - Validate & Test Widget

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

jobs:
  validate-and-test:
    name: Validate and Test (Container)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI Validation Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          load: true
          tags: plasmoid-validator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Validation, Linting & Build in Container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace plasmoid-validator:latest

      - name: Upload Plasmoid Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev.muench.uptime-kuma-plasmoid
          path: dev.muench.uptime-kuma.plasmoid
          retention-days: 14

  test-real-uptime-kuma:
    name: Real Kuma E2E (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "v1 (1.23.16)"
            image: "louislam/uptime-kuma:1.23.16"
            env: ""
            port: 3001
          - name: "v2 (latest)"
            image: "louislam/uptime-kuma:2"
            env: "-e UPTIME_KUMA_DB_TYPE=sqlite"
            port: 3001

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start Uptime Kuma Container
        run: |
          echo "Starting ${{ matrix.name }} container..."
          docker run -d --name kuma \
            ${{ matrix.env }} \
            -p ${{ matrix.port }}:3001 \
            ${{ matrix.image }}

          echo "Waiting for server to initialize..."
          for i in $(seq 1 45); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${{ matrix.port }}/" || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "302" ]; then
              echo "Server is responding (HTTP $CODE) after ${i}s."
              break
            fi
            sleep 1
          done

      - name: Seed Database
        run: |
          echo "Seeding test database..."
          docker exec -i kuma sqlite3 /app/data/kuma.db < tests/fixtures/seed.sql
          docker restart kuma

          echo "Waiting for status page after restart..."
          for i in $(seq 1 30); do
            if curl -s "http://127.0.0.1:${{ matrix.port }}/api/status-page/default" | grep -q "Production Services"; then
              echo "Status page ready after ${i}s."
              break
            fi
            sleep 1
          done

      - name: Run Integration Tests
        env:
          KUMA_URL: "http://127.0.0.1:${{ matrix.port }}"
          KUMA_API_KEY: "uk1_mysecretkey"
        run: |
          node --test tests/integration.test.js

      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          echo "=== Container Logs ==="
          docker logs kuma
